version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trip_planner_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tripplanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tripplanner"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trip-planner-net

  redis:
    image: redis:7-alpine
    container_name: trip_planner_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trip-planner-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: trip_planner_jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    healthcheck:
      test: ["CMD", "wget", "--spider", "-S", "http://localhost:16686"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trip-planner-net

  backend:
    build: apps/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trip-planner-net
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@postgres/tripplanner
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  frontend:
    build: apps/frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - trip-planner-net
networks:
  trip-planner-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

